name: OpenAI devis — recette sans déploiement

on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/index.js'
      - 'functions/contact-guard.js'
      - 'functions/openai-conversions.js'
      - 'scripts/test-contact-guard*.cjs'
      - 'public/**'
      - 'scripts/test-openai-*.cjs'
      - 'scripts/prepare-openai-staging.cjs'
      - 'scripts/prepare-openai-live-source.cjs'
      - 'scripts/fixtures/contact-production-20261030.txt'
      - '.github/workflows/openai-measurement-qa.yml'

permissions:
  contents: read

jobs:
  quote-measurement:
    name: Tests devis et consentement (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Vérifier la syntaxe
        run: |
          node --check functions/index.js
          node --check functions/contact-guard.js
          node --check public/scripts/contact-antispam.js
          node --check public/consent-ga.js
          node --check functions/openai-conversions.js
          node --check public/scripts/openai-attribution.js
          python -m json.tool firebase.json > /dev/null
      - name: Installer le DOM de test isolé
        run: npm install --prefix "$RUNNER_TEMP/mocyno-dom-qa" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Tester les devis sans e-mails ni conversions réels
        run: |
          export MOCYNO_JSDOM_MODULE="$RUNNER_TEMP/mocyno-dom-qa/node_modules/jsdom"
          node --test scripts/test-openai-capi.cjs scripts/test-openai-attribution.cjs scripts/test-openai-live-source.cjs scripts/test-contact-guard.cjs scripts/test-contact-guard-ui.cjs
