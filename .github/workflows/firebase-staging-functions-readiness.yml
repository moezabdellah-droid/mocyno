name: Firebase staging — inventaire Functions
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/firebase-staging-functions-readiness.yml']
permissions:
  contents: read
jobs:
  staging-readiness:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Vérifier uniquement la lecture du site mocyno-staging
        env:
          FIREBASE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SA }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/mocyno-staging-readiness.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS" "$RUNNER_TEMP/firebase-readiness-output.json" "$RUNNER_TEMP/firebase-readiness-error.log"' EXIT
          python - <<'PY'
          import json, os
          value = os.environ.get("FIREBASE_ACCOUNT_JSON", "")
          if not value:
              raise SystemExit("FIREBASE_SA absent : accès non vérifié.")
          try:
              data = json.loads(value)
              assert data.get("type") == "service_account"
          except Exception:
              raise SystemExit("FIREBASE_SA invalide : accès non vérifié.")
          path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "w") as handle:
              json.dump(data, handle)
          PY
          python - <<'PY'
          import json, os, re
          with open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]) as handle:
              principal = json.load(handle).get("client_email", "")
          if not re.fullmatch(r"[a-zA-Z0-9._-]+@[a-zA-Z0-9.-]+\.iam\.gserviceaccount\.com", principal):
              raise SystemExit("Identite du compte technique non reconnue.")
          print("Compte technique a verifier sur mocyno-staging : " + principal)
          PY
          unset FIREBASE_ACCOUNT_JSON
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const credentials = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
            const enc = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const unsigned = enc({alg:'RS256',typ:'JWT'}) + '.' + enc({iss:credentials.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+300});
            const signature = crypto.sign('RSA-SHA256',Buffer.from(unsigned),credentials.private_key).toString('base64url');
            const auth = await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:unsigned+'.'+signature})});
            if (!auth.ok) throw new Error('OAuth HTTP '+auth.status);
            const token = (await auth.json()).access_token;
            if (!token) throw new Error('OAuth token absent');
            const headers = {Authorization:'Bearer '+token,'Content-Type':'application/json'};
            const response = await fetch('https://cloudfunctions.googleapis.com/v2/projects/mocyno-staging/locations/europe-west1/functions/contactForm',{headers});
            console.log('Metadata contactForm HTTP : '+response.status);
            if (!response.ok) throw new Error('Metadata HTTP '+response.status);
            const data = await response.json();
            const config = data.serviceConfig || {};
            const env = config.environmentVariables || {};
            console.log('RESEND_API_KEY environment present : '+Boolean(env.RESEND_API_KEY));
            console.log('RESEND_API_KEY secret mounted : '+Boolean((config.secretEnvironmentVariables || []).some(x => x.key === 'RESEND_API_KEY')));
            console.log('Previous source reference present : '+Boolean(data.buildConfig?.source?.storageSource?.object));
            const permissions = ['cloudfunctions.functions.update','cloudfunctions.functions.get','cloudfunctions.operations.get','cloudbuild.builds.create','serviceusage.services.use'];
            const check = await fetch('https://cloudresourcemanager.googleapis.com/v1/projects/mocyno-staging:testIamPermissions',{method:'POST',headers,body:JSON.stringify({permissions})});
            console.log('Permission preflight HTTP : '+check.status);
            if (!check.ok) throw new Error('Permissions HTTP '+check.status);
            const granted = (await check.json()).permissions || [];
            for (const p of permissions) console.log('Permission '+p+' : '+granted.includes(p));
          })().catch(error => { console.error('Read-only preflight failed: '+String(error.message).replace(/https?:\/\/\S+/g,'[URL]'));process.exitCode=1;});
          NODE
          if ! npx -y firebase-tools@latest functions:list --debug --project mocyno-staging --json --non-interactive > "$RUNNER_TEMP/firebase-readiness-output.json" 2> "$RUNNER_TEMP/firebase-readiness-error.log"; then
            python - <<'PY'
          import os
          text = ""
          for filename in ("firebase-readiness-output.json", "firebase-readiness-error.log", "firebase-debug.log"):
              try:
                  with open((filename if filename == "firebase-debug.log" else os.path.join(os.environ["RUNNER_TEMP"], filename))) as handle:
                      text += handle.read().lower()
              except OSError:
                  pass
          import re, json
          for code in sorted(set(re.findall(r"\b(?:401|403|404|429|500|503)\b", text))):
              print("Code HTTP mentionne : " + code)
          for permission in sorted(set(re.findall(r"(?:cloudfunctions|run|serviceusage|resourcemanager)\.[a-z0-9_.]+", text))):
              print("Permission ou methode mentionnee : " + permission)
          try:
              with open(os.path.join(os.environ["RUNNER_TEMP"], "firebase-readiness-output.json")) as handle:
                  payload = json.load(handle)
              error = payload.get("error", "")
              message = error.get("message", "") if isinstance(error, dict) else str(error)
              with open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]) as handle:
                  credentials = json.load(handle)
              for key in ("private_key", "private_key_id", "client_id"):
                  secret = credentials.get(key)
                  if secret: message = message.replace(secret, "[REDACTED]")
              message = re.sub(r"https?://[^\\s]+", "[URL]", message)
              message = re.sub(r"(?:Bearer\\s+|ya29\\.|AIza)[A-Za-z0-9._~+/-]+", "[REDACTED]", message)
              print("Erreur Firebase nettoyee : " + message[:1500].replace("\\n", " "))
          except Exception:
              print("Erreur Firebase : detail JSON indisponible.")
          for marker in ("service_disabled", "access_token_scope_insufficient", "consumer_invalid", "billing_disabled", "iam_permission_denied"):
              if marker in text: print("Motif Google : " + marker)
          for permission in sorted(set(re.findall(r"(?:firebasehosting|firebase|resourcemanager|serviceusage)\\.[a-z0-9_.]+", text))):
              print("Permission mentionnee : " + permission)
          for service in sorted(set(re.findall(r"[a-z0-9-]+\\.googleapis\\.com", text))):
              print("API mentionnee : " + service)
          categories = {
              "HTTP 403 / permissions": ("403", "permission_denied", "permission denied", "does not have permission"),
              "HTTP 401 / authentification": ("401", "unauthenticated", "invalid_grant", "invalid jwt", "invalid credentials"),
              "HTTP 404 / ressource absente": ("404", "not_found"),
              "Reseau / registre npm": ("enotfound", "etimedout", "econnreset", "npm error"),
          }
          matched = [label for label, tokens in categories.items() if any(token in text for token in tokens)]
          print("Diagnostic normalise : " + (", ".join(matched) if matched else "cause non classee"))
          PY
            echo "::error::Lecture de mocyno-staging non confirmee. Aucun deploiement tente."
            exit 1
          fi
          python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["RUNNER_TEMP"], "firebase-readiness-output.json")) as handle:
              value = json.load(handle)
          def contains_site(node):
              if isinstance(node, dict):
                  return any(contains_site(v) for v in node.values())
              if isinstance(node, list):
                  return any(contains_site(v) for v in node)
              return isinstance(node, str) and node in ("mocyno-staging", "projects/mocyno-staging/sites/mocyno-staging", "https://mocyno-staging.web.app")
          if value.get("status") != "success":
              raise SystemExit("Site mocyno-staging non confirmé. Aucun déploiement tenté.")
          result = value.get("result", [])
          if isinstance(result, dict):
              result = result.get("functions", [])
          if not isinstance(result, list):
              raise SystemExit("Format inventaire inattendu.")
          import re
          print("Nombre de fonctions staging : " + str(len(result)))
          for item in result:
              if not isinstance(item, dict): continue
              safe = {}
              for key in ("id", "name", "region", "runtime", "platform", "state", "entryPoint"):
                  field = item.get(key)
                  if isinstance(field, str) and re.fullmatch(r"[A-Za-z0-9_./-]{1,250}", field):
                      safe[key] = field
              print("Fonction staging : " + json.dumps(safe, sort_keys=True))
          print("Inventaire Functions staging accessible. Aucun déploiement.")
          PY
