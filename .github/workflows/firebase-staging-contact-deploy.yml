name: Firebase staging — contactForm autorisé
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/firebase-staging-contact-deploy.yml']
permissions:
  contents: read
jobs:
  deploy-contact-staging:
    if: github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.before == 'ce1b82734fce92b59e1d3e2093af936e84d8c90b'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ce1b82734fce92b59e1d3e2093af936e84d8c90b
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Tester et préparer uniquement le paquet de recette
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-openai-measurement.cjs scripts/test-openai-staging.cjs
          node scripts/prepare-openai-staging.cjs "$RUNNER_TEMP/mocyno-contact-source"
          node --check "$RUNNER_TEMP/mocyno-contact-source/index.js"
          python - <<'PY'
          import os,zipfile
          folder=os.path.join(os.environ["RUNNER_TEMP"],"mocyno-contact-source")
          with zipfile.ZipFile(os.path.join(os.environ["RUNNER_TEMP"],"mocyno-staging-contact.zip"),"w",zipfile.ZIP_DEFLATED) as z:
              for name in ("index.js","package.json","package-lock.json"):
                  z.write(os.path.join(folder,name),name)
          PY
      - name: Mettre à jour seulement la source de contactForm staging et relire
        env:
          FIREBASE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SA }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/contact-staging-auth.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python - <<'PY'
          import os,json
          data=json.loads(os.environ["FIREBASE_ACCOUNT_JSON"])
          assert data.get("type")=="service_account"
          fd=os.open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"],os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,"w") as handle: json.dump(data,handle)
          PY
          unset FIREBASE_ACCOUNT_JSON
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const name='projects/mocyno-staging/locations/europe-west1/functions/contactForm';
          const origin='https://cloudfunctions.googleapis.com/v2/';
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
           const c=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS,'utf8'));
           const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url'),now=Math.floor(Date.now()/1000);
           const u=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:c.client_email,scope:'https://www.googleapis.com/auth/cloud-platform',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+3600});
           const signed=u+'.'+crypto.sign('RSA-SHA256',Buffer.from(u),c.private_key).toString('base64url');
           const auth=await fetch('https://oauth2.googleapis.com/token',{method:'POST',body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:signed})});
           if(!auth.ok)throw Error('OAuth HTTP '+auth.status);
           const token=(await auth.json()).access_token;if(!token)throw Error('Token absent');
           async function api(path,method='GET',body){
            const r=await fetch(origin+path,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
            if(!r.ok){console.log('API failure HTTP '+r.status); const text=await r.text();const permissions=[...new Set(text.match(/(?:iam|cloudfunctions|cloudbuild|run|storage|artifactregistry)\.[A-Za-z0-9_.]+/g)||[])];console.log('Permissions mentioned: '+JSON.stringify(permissions));throw Error('Google API request failed');}
            return r.json();
           }
           const before=await api(name);
           if(before.name!==name||before.state!=='ACTIVE'||before.buildConfig?.entryPoint!=='contactForm'||before.buildConfig?.runtime!=='nodejs22')throw Error('Unexpected function metadata; deployment refused');
           const oldSource=before.buildConfig?.source?.storageSource;if(!oldSource?.object)throw Error('Previous source reference absent');
           console.log('Rollback source reference: '+JSON.stringify(oldSource));
           const configBefore=JSON.stringify(before.serviceConfig.environmentVariables||{});
           const accountBefore=before.serviceConfig.serviceAccountEmail;
           if(!before.serviceConfig.environmentVariables?.RESEND_API_KEY)throw Error('Mail configuration absent; deployment refused');
           const upload=await api('projects/mocyno-staging/locations/europe-west1/functions:generateUploadUrl','POST',{environment:'GEN_2'});
           const target=new URL(upload.uploadUrl);if(target.protocol!=='https:'||!target.hostname.endsWith('.googleapis.com')||!upload.storageSource)throw Error('Unexpected upload destination');
           const put=await fetch(target,{method:'PUT',headers:{'Content-Type':'application/zip'},body:fs.readFileSync(process.env.RUNNER_TEMP+'/mocyno-staging-contact.zip')});
           if(!put.ok)throw Error('Source upload HTTP '+put.status);
           const operation=await api(name+'?updateMask=buildConfig.source','PATCH',{name,buildConfig:{source:{storageSource:upload.storageSource}}});
           if(!operation.name?.startsWith('projects/mocyno-staging/locations/europe-west1/operations/'))throw Error('Unexpected operation');
           console.log('Source update accepted for contactForm staging only.');
           let done;
           for(let i=0;i<150;i++){done=await api(operation.name);if(done.done)break;if(i%6===0)console.log('Staging build/deploy in progress.');await pause(5000);}
           if(!done?.done)throw Error('Operation still running; do not retry blindly');
           if(done.error){console.log('Operation failure code: '+done.error.code);throw Error('Deployment operation failed');}
           const after=await api(name);
           if(after.state!=='ACTIVE'||JSON.stringify(after.serviceConfig.environmentVariables||{})!==configBefore||after.serviceConfig.serviceAccountEmail!==accountBefore)throw Error('Post-deployment verification failed');
           if(after.buildConfig.source.storageSource.object===oldSource.object)throw Error('Source unchanged');
           console.log('Verified: contactForm ACTIVE, new source, environment and runtime identity preserved.');
           const uri=new URL(after.serviceConfig.uri);if(uri.protocol!=='https:'||!uri.hostname.endsWith('.run.app'))throw Error('Unexpected function URL');
           const get=await fetch(uri);console.log('Function GET check HTTP '+get.status);if(get.status!==405)throw Error('GET behavior unexpected');
           const invalid=await fetch(uri,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}'});console.log('Invalid form HTTP '+invalid.status);if(invalid.status!==400)throw Error('Validation check failed');
           const honey=await fetch(uri,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({website:'qa-honeypot'})});const receipt=await honey.json();if(receipt.accepted!==false||receipt.event_id)throw Error('Honeypot check failed');
           console.log('Verified: invalid form and honeypot do not produce successful lead receipts. No successful form submitted; no test email requested.');
          })().catch(e=>{console.error('Staging deployment/check stopped: '+e.message);process.exitCode=1;});
          NODE
